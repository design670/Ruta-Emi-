<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body>
<div id="glow" class="abs" style="left:0;top:0;width:1920px;height:1080px;background:radial-gradient(ellipse 60% 30% at 50% 50%, rgba(124,92,255,.35), transparent 70%)"></div>
<div id="line" class="abs" style="left:360px;top:539px;width:1200px;height:2px;background:linear-gradient(90deg,transparent,#fff,transparent)"></div>
<div id="a" class="abs h2" style="left:0;width:1920px;top:410px;text-align:center">Lo pequeño</div>
<div id="b" class="abs h2 grad" style="left:0;width:1920px;top:560px;text-align:center">captura lo grande.</div>
<script type="module">
import { prog, easeOut, easeInOut, textIn } from './lib.js';
const $ = (id) => document.getElementById(id);
window.film = {
  duration: 4,
  frame(t) {
    const g = easeInOut(prog(t, 0, 1.4)), out = prog(t, 3.4, 4);
    $('line').style.transform = `scaleX(${g})`;
    $('line').style.opacity = (1 - prog(t, 1.6, 2.4)) * (1 - out);
    $('glow').style.opacity = easeOut(prog(t, 0.4, 2)) * (1 - out);
    textIn($('a'), t, 0.9, 0.8, 3.4);
    textIn($('b'), t, 1.6, 0.8, 3.4);
  },
};
</script></body></html>
