<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body>
<div class="abs" style="left:0;top:0;width:1920px;height:1080px;background:radial-gradient(circle at 72% 50%, #16131f, #050506 60%)"></div>
<div id="eye" class="abs eyebrow" style="left:160px;top:330px">Estabilización</div>
<div id="t1" class="abs h2" style="left:160px;top:380px;width:900px">Mecánica,<br>en 3 ejes.</div>
<div id="t2" class="abs p" style="left:160px;top:600px;width:760px">Camina, corre, salta.<br>La imagen se queda quieta.</div>
<svg id="axes" class="abs" style="left:1080px;top:60px;width:700px;height:700px;overflow:visible" viewBox="0 0 700 700">
  <ellipse id="ax1" cx="350" cy="330" rx="260" ry="70" fill="none" stroke="#ff5a36" stroke-width="3" stroke-dasharray="1700" />
  <ellipse id="ax2" cx="350" cy="330" rx="70" ry="260" fill="none" stroke="#7c5cff" stroke-width="3" stroke-dasharray="1700" />
  <circle id="ax3" cx="350" cy="330" r="220" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="2" stroke-dasharray="1400" />
</svg>
<div id="cam" class="abs camera" style="left:1280px;top:190px;width:300px;height:700px"></div>
<script type="module">
import { prog, easeOut, textIn, cameraSVG } from './lib.js';
const $ = (id) => document.getElementById(id);
$('cam').innerHTML = cameraSVG('c');
window.film = {
  duration: 5,
  frame(t) {
    textIn($('eye'), t, 0.1, 0.6); textIn($('t1'), t, 0.3, 0.7); textIn($('t2'), t, 0.9, 0.7);
    // the hand moves: the body jitters and tilts…
    const k = easeOut(prog(t, 0.6, 1.4));
    const rot = k * (Math.sin(t * 7.3) * 6 + Math.sin(t * 13.1) * 3);
    const dx = k * (Math.sin(t * 5.1) * 18 + Math.sin(t * 11.7) * 7);
    const dy = k * (Math.sin(t * 6.4 + 1) * 22 + Math.sin(t * 17.3) * 6);
    $('c-body').setAttribute('transform', `translate(${dx} ${dy}) rotate(${rot} 150 450)`);
    $('c-yoke').setAttribute('transform', `translate(${dx * 0.5} ${dy * 0.5}) rotate(${rot * 0.4} 150 120)`);
    // …and the head stays still
    $('c-head').setAttribute('transform', '');
    ['ax1', 'ax2', 'ax3'].forEach((id, i) => {
      const d = easeOut(prog(t, 1.2 + i * 0.35, 2.2 + i * 0.35));
      $(id).style.strokeDashoffset = (1 - d) * (i === 2 ? 1400 : 1700);
      $(id).style.opacity = d;
    });
    $('axes').style.transform = `rotate(${t * 6}deg)`;
  },
};
</script></body></html>
