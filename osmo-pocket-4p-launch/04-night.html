<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body>
<div class="abs" style="left:0;top:0;width:1920px;height:1080px;background:linear-gradient(180deg,#05040c,#0d0920 60%,#1a0d1a)"></div>
<div id="bokeh" class="abs" style="left:0;top:0;width:1920px;height:1080px"></div>
<div id="lens" class="abs" style="left:660px;top:240px;width:600px;height:600px;border-radius:50%;
  background:radial-gradient(circle at 40% 36%, rgba(120,100,255,.55), rgba(20,14,80,.9) 40%, #02020a 72%);
  box-shadow:0 0 0 26px #0b0c0f, 0 0 0 30px #30343c, 0 0 0 80px #17191d, 0 0 120px 60px rgba(124,92,255,.25)"></div>
<div id="t1" class="abs h2" style="left:0;width:1920px;top:880px;text-align:center">La noche, con todo su color.</div>
<script type="module">
import { prog, lerp, easeOut, easeInOut, textIn, rng } from './lib.js';
const $ = (id) => document.getElementById(id);
const r = rng(7), colors = ['#ff9a4a', '#ff5a36', '#ffd27a', '#7c5cff', '#4fb2ff', '#ff6fb5'];
const dots = Array.from({ length: 46 }, () => {
  const d = document.createElement('div');
  const size = 30 + r() * 150;
  Object.assign(d.style, { position: 'absolute', width: size + 'px', height: size + 'px', borderRadius: '50%',
    background: `radial-gradient(circle, ${colors[Math.floor(r() * colors.length)]} 0%, transparent 70%)` });
  $('bokeh').appendChild(d);
  return { d, size, x: r() * 2100 - 90, y: r() * 1080, sp: 20 + r() * 60, ph: r() * 6.28 };
});
window.film = {
  duration: 5,
  frame(t) {
    const fade = easeOut(prog(t, 0, 1));
    for (const b of dots) {
      b.d.style.transform = `translate(${b.x - b.size / 2 - t * b.sp}px, ${b.y - b.size / 2}px)`;
      b.d.style.opacity = fade * (0.35 + 0.35 * Math.sin(t * 1.5 + b.ph));
    }
    const z = easeInOut(prog(t, 0, 5));
    $('lens').style.transform = `scale(${lerp(0.55, 1.05, z)})`;
    $('lens').style.opacity = easeOut(prog(t, 0.2, 1.2));
    textIn($('t1'), t, 1.6, 0.8);
  },
};
</script></body></html>
